name: Daily Trade Study

on:
  schedule:
    # GitHub cron은 1~3시간씩 늦게 시작되므로 새벽(KST 02:17~06:17)에 미리 시작하고,
    # notify-kakao 잡이 07:30 KST까지 기다렸다가 전송한다.
    # 여러 번 시작돼도 하루 1회만 전송한다 (gate의 캐시 마커).
    - cron: "17 17 * * *" # 02:17 KST
    - cron: "17 18 * * *" # 03:17 KST
    - cron: "17 19 * * *" # 04:17 KST
    - cron: "17 20 * * *" # 05:17 KST
    - cron: "17 21 * * *" # 06:17 KST
    - cron: "40 22 * * *" # 07:40 KST
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 보냈어도 다시 전송"
        type: boolean
        default: false
      send_now:
        description: "07:30까지 기다리지 않고 즉시 전송"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-trade-study
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Seoul date
        id: date
        run: echo "date=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore sent marker
        id: sent
        uses: actions/cache@v4
        with:
          path: .daily-sent
          key: kakao-sent-${{ steps.date.outputs.date }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "force → execute"
          elif [ "${{ steps.sent.outputs.cache-hit }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "already sent ${{ steps.date.outputs.date }} → skip"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "not sent yet → run"
          fi

  build-page:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate study HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Seoul
        run: |
          python main.py --write-html --subject trade
          python main.py --write-html --subject constitution

      # Pages 배포는 매번 사이트 전체를 교체하므로, 지난 학습이 사라지지 않게 lessons/ 를 저장소에 쌓는다
      - name: Commit lesson
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons
          git commit -m "Add lessons $(jq -r .id content-trade.json), $(jq -r .id content-constitution.json)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload content files for notify job
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-${{ github.run_id }}
          path: content-*.json

  deploy-page:
    needs: [gate, build-page]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-kakao:
    needs: [gate, deploy-page]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # 02:17에 시작하면 07:30까지 최대 약 5시간 대기
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Sent marker cache
        uses: actions/cache@v4
        with:
          path: .daily-sent
          key: kakao-sent-${{ needs.gate.outputs.date }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download content files
        uses: actions/download-artifact@v4
        with:
          name: daily-content-${{ github.run_id }}

      - name: Wait until 07:30 KST
        if: inputs.send_now != true
        run: |
          target=$(TZ=Asia/Seoul date -d "07:30" +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            wait=$((target - now))
            echo "07:30 KST까지 ${wait}초 대기"
            sleep "$wait"
          else
            echo "이미 07:30 KST 이후 → 즉시 전송"
          fi

      - name: Send Kakao teaser
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          CONTENT_BASE_URL: ${{ needs.deploy-page.outputs.page_url }}
          TZ: Asia/Seoul
        run: |
          python main.py --send-kakao --subject trade
          python main.py --send-kakao --subject constitution
          mkdir -p .daily-sent
          echo "sent ${{ needs.gate.outputs.date }}" > .daily-sent/ok
