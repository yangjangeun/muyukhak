name: Daily Trade Study

on:
  schedule:
    # 07:00 KST부터 여러 번 시작을 걸어 두고, 시작되면 만들자마자 바로 전송한다.
    # GitHub cron은 늦거나 빠질 수 있어 여러 번 걸며, 하루 1회만 전송한다 (gate의 캐시 마커).
    - cron: "2 22 * * *" # 07:02 KST
    - cron: "22 22 * * *" # 07:22 KST
    - cron: "42 22 * * *" # 07:42 KST
    - cron: "12 23 * * *" # 08:12 KST
    - cron: "42 23 * * *" # 08:42 KST
    - cron: "42 0 * * *" # 09:42 KST
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 보냈어도 다시 전송"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-trade-study
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Seoul date
        id: date
        run: echo "date=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore sent marker
        id: sent
        uses: actions/cache@v4
        with:
          path: .daily-sent
          key: kakao-sent-${{ steps.date.outputs.date }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "force → execute"
          elif [ "${{ steps.sent.outputs.cache-hit }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "already sent ${{ steps.date.outputs.date }} → skip"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "not sent yet → run"
          fi

  build-page:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate study HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Seoul
        run: |
          python main.py --write-html --subject trade
          python main.py --write-html --subject constitution

      # Pages 배포는 매번 사이트 전체를 교체하므로, 지난 학습이 사라지지 않게 lessons/ 를 저장소에 쌓는다
      - name: Commit lesson
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons
          git diff --cached --quiet && exit 0
          git commit -m "Add lessons $(jq -r .id content-trade.json), $(jq -r .id content-constitution.json)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload content files for notify job
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-${{ github.run_id }}
          path: content-*.json

  deploy-page:
    needs: [gate, build-page]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-kakao:
    needs: [gate, deploy-page]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sent marker cache
        uses: actions/cache@v4
        with:
          path: .daily-sent
          key: kakao-sent-${{ needs.gate.outputs.date }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download content files
        uses: actions/download-artifact@v4
        with:
          name: daily-content-${{ github.run_id }}

      - name: Send Kakao teaser
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          CONTENT_BASE_URL: ${{ needs.deploy-page.outputs.page_url }}
          TZ: Asia/Seoul
        run: |
          python main.py --send-kakao --subject trade
          python main.py --send-kakao --subject constitution
          mkdir -p .daily-sent
          echo "sent ${{ needs.gate.outputs.date }}" > .daily-sent/ok
